<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <title>Offline · Gym Journal</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f7; --label: #18181b; --label-2: #5c5c66; --tint: #4f46e5; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --label: #f4f4f5; --label-2: #a1a1aa; --tint: #5b5ee8; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--label);
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; padding: 0 16px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 22%; }
      h1 { font-size: 1.75rem; letter-spacing: -0.02em; margin: 16px 0 8px; }
      p { color: var(--label-2); font-size: 0.9375rem; max-width: 28rem; margin: 0 auto 24px; line-height: 1.4; }
      button { background: var(--tint); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 1.0625rem; }
      button:active { transform: scale(0.97); opacity: 0.75; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page needs a connection to load. A workout page that's already open keeps saving on this device and syncs when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
