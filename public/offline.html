<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · Gym Journal</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #f5f5f5;
        font-family: system-ui, -apple-system, sans-serif; padding: 0 16px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #a3a3a3; font-size: 0.9rem; max-width: 28rem; margin: 0 auto 20px; line-height: 1.5; }
      button { background: #fafafa; color: #0a0a0a; border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page needs a connection to load. A workout page that's already open keeps saving on this device and syncs when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
