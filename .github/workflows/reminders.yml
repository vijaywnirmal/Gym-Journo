name: Send workout reminders

# Calls the app's reminder job every 15 minutes. The job itself decides who is due (their planned
# workout, their chosen local time, not yet reminded or trained today), so a late or skipped run
# only delays a reminder: anyone still due is picked up by the next one, up to 3 hours late.
#
# Opt-in: nothing runs until the repository variable APP_URL (e.g. https://your-app.vercel.app)
# and the secret CRON_SECRET (the same value as the app's CRON_SECRET) are set (README → "Deploying").
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: workout-reminders
  cancel-in-progress: false

permissions: {}

jobs:
  send:
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the reminder job
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/reminders"
